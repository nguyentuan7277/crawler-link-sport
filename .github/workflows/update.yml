name: Cập nhật Lịch Bóng Đá M3U8 (Chuối Chiên TV)

on:
  schedule:
    # Chạy tự động mỗi 1 tiếng một lần (giờ UTC)
    - cron: '0 */1 * * *'
  # Cho phép kích hoạt chạy bằng tay từ giao diện GitHub
  workflow_dispatch:

permissions:
  contents: write

jobs:
  crawl-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cài đặt Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Chạy Crawler
        run: |
          python crawler.py

      - name: Tự động commit và push nếu có thay đổi
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add sport.m3u8
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update sport.m3u8 [skip ci]" && git push)
